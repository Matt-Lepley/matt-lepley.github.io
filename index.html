<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<h1>Dog Whistle</h1>

<input type="range" min="8000" max="18000" value="8000" class="slider" id="frequencySlider">

<br>
<h3>
  Frequency (Hz)
  <span id="frequencyOutput">8000</span>
</h3>
<br><br>
<button id="toggleWhistleButton" class="startPlaying" onclick="toggleWhistle()">START</button>

<style>
  body {
    margin: 0 auto;
    text-align: center;
    font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    background-color: #B0C4B1	;
  }

  #frequencySlider {
    width: 75vw;
    max-width:500px;
  }

  #toggleWhistleButton {
    margin-top: 50px;
    width: 75vw;
    height: 75vw;
    max-width:500px;
    max-height:500px;
    border-radius:50%;
    border:2px solid black;
    font-size:32px;
    font-weight: bold;
    cursor:pointer;
  }
  .startPlaying {
    background-color:lightgreen;
  }
  .stopPlaying {
    background-color:coral;
  }
</style>

<script>
  ////////////////////////////////
  // Slider logic
  ////////////////////////////////
  let slider = document.getElementById("frequencySlider");
  let output = document.getElementById("frequencyOutput");
  let toggleWhistleButton = document.getElementById("toggleWhistleButton");

  output.innerHTML = slider.value;

  slider.oninput = function() {
    output.innerHTML = this.value;
  }

  ////////////////////////////////
  // Play/Stop logic
  ////////////////////////////////
  let context;
  let oscillator;
  let playing = false;

  function toggleWhistle() {
    if (playing) {
      stopWhistle();
      playing = false;
      toggleWhistleButton.innerHTML = "START";
      toggleWhistleButton.classList.remove('stopPlaying');
      toggleWhistleButton.classList.add('startPlaying');
    } else {
      startWhistle();
      playing = true;
      toggleWhistleButton.innerHTML = "STOP";
      toggleWhistleButton.classList.add('startPlaying');
      toggleWhistleButton.classList.add('stopPlaying');
    }
  }

  function startWhistle() {
    const frequency = document.getElementById('frequencySlider').value;

    context = new (window.AudioContext || window.webkitAudioContext)();
    oscillator = context.createOscillator();
    oscillator.type = 'sine'; // You could try 'square', 'triangle', etc.
    oscillator.frequency.setValueAtTime(frequency, context.currentTime);
    oscillator.connect(context.destination);
    oscillator.start();
  }

  function stopWhistle() {
    if (oscillator) {
      oscillator.stop();
      oscillator.disconnect();
    }
    if (context) {
      context.close();
    }
  }
</script>
